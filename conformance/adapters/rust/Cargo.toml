[package]
name = "ehbp-conformance-adapter"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "ehbp-adapter"
path = "src/main.rs"

[dependencies]
tinfoil-ehbp = { path = "../../../rust" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
hex = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
