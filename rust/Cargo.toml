[package]
name = "tinfoil-ehbp"
version = "0.7.0"
edition = "2021"
rust-version = "1.87"
description = "Rust client for the encrypted HTTP body protocol"
license = "MIT"

[features]
default = ["rustls-aws-lc"]
rustls-aws-lc = ["reqwest/rustls"]
rustls-no-provider = ["reqwest/rustls-no-provider"]

[dependencies]
aes-gcm = "0.10"
async-stream = "0.3"
bytes = "1"
ehbp-core = { path = "../dafny/gen-events/rs", package = "ehbp-events-core" }
futures-core = "0.3"
hmac = "0.12"
rand = { version = "0.9", default-features = false, features = ["os_rng", "std_rng"] }
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["rt", "sync"] }
url = "2"
x25519-dalek = "2"
zeroize = "1"

[dev-dependencies]
futures-util = "0.3"
hex = "0.4"
hpke = "0.13"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
