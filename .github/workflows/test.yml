name: Run Tests

on:
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read

jobs:
  test-go:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    
    - name: Set up Go
      uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4.3.0
      with:
        go-version-file: go.mod
    
    - name: Download Go dependencies
      run: go mod download
    
    - name: Check go fix
      run: |
        go fix ./...
        if [ -n "$(git diff)" ]; then
          git diff
          echo "::error::go fix has suggestions. Run 'go fix ./...' and commit the result."
          exit 1
        fi

    - name: Run Go tests
      run: go test -race -v ./...

    - name: Run interop test vector tests
      run: go test -race -v -run 'InteropVector|Interop' ./...

  check-generated:
    # The committed Dafny bundles, the rendered regions and the fixtures must be
    # exactly what the sources produce; the hand-written ports keep their shape.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4.3.0
      with:
        go-version-file: go.mod

    - name: Set up .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
      with:
        dotnet-version: '8.0.x'

    - name: Install Dafny and goimports
      run: |
        dotnet tool install --global dafny --version 4.11.0
        go install golang.org/x/tools/cmd/goimports@latest
        echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

    - name: Verify the core
      run: dafny verify --verification-time-limit 120 ehbp.dfy ehbp_events.dfy ehbp_server.dfy ehbp_tests.dfy fixtures.dfy spec_rules.dfy && dafny test ehbp_tests.dfy
      working-directory: dafny

    - name: Regenerate the bundles
      run: ./generate.sh --no-verify && ./generate-events.sh --no-verify
      working-directory: dafny

    - name: Install the generators' dependencies
      run: python3 -m pip install jinja2 pytest

    - name: Test the generators
      run: python3 -m pytest conformance/tools/tests -q

    - name: Check the ports and the fixtures
      run: |
        python3 conformance/tools/check.py
        python3 conformance/tools/fixture_check.py

    - name: Fail on drift
      run: |
        git add -N .
        if [ -n "$(git status --porcelain)" ]; then
          git status --porcelain
          git diff | head -200
          echo "::error::generated output differs from the sources; run dafny/generate.sh, dafny/generate-events.sh and conformance/tools/gen.py and commit the result."
          exit 1
        fi

  test-js:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: js/package-lock.json
    
    - name: Install npm dependencies
      run: npm ci
      working-directory: js
    
    - name: Build TypeScript
      run: npm run build
      working-directory: js
    
    - name: Run npm tests
      run: npm test
      working-directory: js

    - name: Run interop test vector tests
      run: node --test --test-name-pattern='interop' dist/esm/test/*.test.js
      working-directory: js

  test-swift:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: latest-stable

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Build the core xcframework
      run: ./swift/build-core.sh

    - name: Build Swift package
      run: swift build

    - name: Run Swift tests
      run: swift test

  test-kotlin:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
      with:
        distribution: temurin
        java-version: '21'

    - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

    - name: Run Kotlin JVM tests (includes interop test vectors)
      run: ./gradlew -PnoAndroid test
      working-directory: kotlin

    # The runner image ships an Android SDK (ANDROID_HOME is set). Compiles the
    # same sources as an Android library against minSdk 21 and fails on NewApi.
    - name: Android compile check (minSdk 21)
      run: ./gradlew :android:assembleRelease :android:lintRelease
      working-directory: kotlin
