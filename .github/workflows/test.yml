name: Run Tests

on:
  pull_request:
    branches: [ "**" ]

permissions:
  contents: read

jobs:
  test-go:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    
    - name: Set up Go
      uses: actions/setup-go@7b8cf10d4e4a01d4992d18a89f4d7dc5a3e6d6f4 # v4.3.0
      with:
        go-version-file: go.mod
    
    - name: Download Go dependencies
      run: go mod download
    
    - name: Check go fix
      run: |
        go fix ./...
        if [ -n "$(git diff)" ]; then
          git diff
          echo "::error::go fix has suggestions. Run 'go fix ./...' and commit the result."
          exit 1
        fi

    - name: Run Go tests
      run: go test -race -v ./...

    - name: Run interop test vector tests
      run: go test -race -v -run 'InteropVector|Interop' ./...

  test-js:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false
    
    - name: Set up Node.js
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: js/package-lock.json
    
    - name: Install npm dependencies
      run: npm ci
      working-directory: js
    
    - name: Build TypeScript
      run: npm run build
      working-directory: js
    
    - name: Run npm tests
      run: npm test
      working-directory: js

    - name: Run interop test vector tests
      run: node --test --test-name-pattern='interop' dist/esm/test/*.test.js
      working-directory: js

  test-swift:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
      with:
        xcode-version: latest-stable

    - name: Build Swift package
      run: swift build
      working-directory: swift

    - name: Run Swift tests
      run: swift test
      working-directory: swift

    - name: Run interop test vector tests
      run: swift test --filter 'InteropVector|Interop'
      working-directory: swift

  test-kotlin:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
      with:
        distribution: temurin
        java-version: '21'

    - name: Run Kotlin JVM tests (includes interop test vectors)
      run: ./gradlew -PnoAndroid test
      working-directory: kotlin

    # The runner image ships an Android SDK (ANDROID_HOME is set). Compiles the
    # same sources as an Android library against minSdk 21 and fails on NewApi.
    - name: Android compile check (minSdk 21)
      run: ./gradlew :android:assembleRelease :android:lintRelease
      working-directory: kotlin
