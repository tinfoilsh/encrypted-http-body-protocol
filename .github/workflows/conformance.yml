name: Conformance

on:
  pull_request:
    branches: ["**"]

# One run per ref: a new push cancels the superseded 40-minute macOS matrix.
concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The cross-language matrix must run on one machine so results can be compared in
# a single process, and Swift needs macOS, so the whole suite runs on a macOS
# runner. It fails on every divergence or cross-diff; no known-failure allowlist
# can conceal a security regression.
jobs:
  conformance:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable

      - name: Build JS library and browser bundle
        working-directory: js
        run: |
          npm ci
          npm run build
          npm run build:browser

      - name: Create Python venv with the ehbp package
        run: |
          python3 -m venv conformance/.venv
          conformance/.venv/bin/pip install -e ./python

      - name: Install Playwright browsers
        working-directory: conformance/adapters/js-browser
        run: |
          npm install
          npx playwright install chromium firefox

      - name: Verify harness and generated security fixtures
        run: |
          python3 -m unittest discover -s conformance/harness -p 'test_*.py'
          conformance/.venv/bin/python conformance/tools/gen_fixtures.py
          git diff --exit-code -- test-vectors/conformance

      - name: Run conformance matrix
        run: |
          python3 conformance/harness/run.py \
            --adapter go --adapter python --adapter js --adapter rust --adapter swift \
            --adapter js-chromium --adapter js-firefox

      - name: Upload conformance report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: conformance-report
          path: |
            conformance/report.md
            conformance/report.json
            conformance/report.html
