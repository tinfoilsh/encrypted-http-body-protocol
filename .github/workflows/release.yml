name: Release

on:
  push:
    tags:
      - "v*"
  # Re-publish to PyPI for a tag that already exists, using the workflow
  # as it is on the branch this is dispatched from rather than the
  # revision frozen into the tag. Only the PyPI jobs run on this path:
  # npm rejects republishing an existing version and the GitHub release
  # already exists.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish to PyPI (e.g. v0.3.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-npm:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: js/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: js

      - name: Build
        run: npm run build
        working-directory: js

      - name: Publish to npm
        run: npm publish --access public
        working-directory: js

  build-pypi:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build a binary wheel and a source tarball
        run: |
          python -m pip install --upgrade build
          python -m build
        working-directory: python

      - name: Store the distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: python/dist/

  publish-pypi:
    needs:
      - build-pypi
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tinfoil-ehbp
    permissions:
      id-token: write
    steps:
      - name: Download the distribution packages
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  create-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
